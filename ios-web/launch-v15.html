<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BALI STOCK">
  <meta name="theme-color" content="#07110c">
  <title>BALI STOCK</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07110c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:32px 20px;box-sizing:border-box}
    .box{width:min(440px,100%);background:#101c15;border:1px solid #294233;border-radius:20px;padding:22px;box-sizing:border-box}
    .brand{color:#39ff6a;font-size:28px;font-weight:900}.muted{margin-top:10px;color:#9fb3a5;line-height:1.45}.error{color:#ff8d94;word-break:break-word}
    button{margin-top:16px;width:100%;border:0;border-radius:13px;padding:13px 16px;background:#39ff6a;color:#031408;font:inherit;font-weight:900}
  </style>
</head>
<body>
<main><div class="box"><div class="brand">BALI STOCK</div><div id="status" class="muted">Загрузка актуальной версии…</div></div></main>
<script>
(async function () {
  const runtimeUrl = 'https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime';
  const v15UiUrl = 'https://raw.githack.com/Nik13599/BALI-STOCK/main/ios-web/v15-ui.js';
  const v15DeliveryUrl = 'https://raw.githack.com/Nik13599/BALI-STOCK/main/ios-web/v15-delivery-link.js';
  const v15CompatUrl = 'https://raw.githack.com/Nik13599/BALI-STOCK/main/ios-web/v15-compat.js';
  const status = document.getElementById('status');
  try {
    const stamp = Date.now();
    const responses = await Promise.all([
      fetch(runtimeUrl + '?launcher=15&ts=' + stamp, {cache:'no-store',headers:{Accept:'text/plain,*/*'}}),
      fetch(v15UiUrl + '?v=' + stamp, {cache:'no-store'}),
      fetch(v15DeliveryUrl + '?v=' + stamp, {cache:'no-store'}),
      fetch(v15CompatUrl + '?v=' + stamp, {cache:'no-store'})
    ]);
    if (!responses[0].ok) throw new Error('Runtime HTTP ' + responses[0].status);
    if (!responses[1].ok || !responses[2].ok || !responses[3].ok) throw new Error('V15 UI не загрузился');
    let html = await responses[0].text();
    const ui = await responses[1].text();
    const delivery = await responses[2].text();
    const compat = await responses[3].text();
    if (!/^\s*<!doctype html>/i.test(html) || !html.includes('BALI STOCK')) throw new Error('Runtime вернул неверный формат');
    if (/return,[A-Za-z_$][A-Za-z0-9_$]*=/.test(html)) throw new Error('Проверка Safari не пройдена');
    if (!html.includes('async function snapshot') || !html.includes('baseSnapshot=snapshot')) throw new Error('Не загружен модуль синхронизации');
    if (!ui.includes('__BALI_STOCK_V15_UI__') || !delivery.includes('__BALI_STOCK_V15_DELIVERY_LINK__') || !compat.includes('__BALI_STOCK_V15_COMPAT__')) throw new Error('Получен неполный V15 модуль');
    const safeUi = ui.replace(/<\/script/gi, '<\\/script');
    const safeDelivery = delivery.replace(/<\/script/gi, '<\\/script');
    const safeCompat = compat.replace(/<\/script/gi, '<\\/script');
    html = html.replace('</body>', '<script id="bali-v15-ui">' + safeUi + '<\/script><script id="bali-v15-delivery-link">' + safeDelivery + '<\/script><script id="bali-v15-compat">' + safeCompat + '<\/script></body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    const message = error && error.message ? error.message : String(error);
    status.className = 'muted error';
    status.textContent = 'Не удалось загрузить BALI STOCK: ' + message;
    const button = document.createElement('button');
    button.textContent = 'Повторить';
    button.onclick = function(){ location.reload(); };
    status.parentNode.appendChild(button);
  }
})();
</script>
</body>
</html>
