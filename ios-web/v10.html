<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BALI STOCK</title><style>html,body{margin:0;background:#07110c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#boot{padding:40px 20px;color:#39ff6a;font-weight:900;font-size:24px}#scanFab{position:fixed;right:14px;bottom:96px;z-index:9999;border:0;border-radius:999px;background:#39ff6a;color:#07110c;padding:14px 16px;font-weight:900;box-shadow:0 8px 24px #0008}#scanPanel{display:none;position:fixed;inset:0;z-index:10000;background:#07110cf2;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 18px);overflow:auto}#reader{max-width:640px;margin:0 auto}.scanCard{max-width:640px;margin:12px auto;background:#101c15;border:1px solid #294233;border-radius:18px;padding:14px}.scanBtn{border:0;border-radius:12px;background:#39ff6a;color:#07110c;padding:12px 14px;font-weight:900}.scanBtn.secondary{background:#183522;color:#39ff6a}.scanInput{width:100%;box-sizing:border-box;background:#0c1710;color:white;border:1px solid #294233;border-radius:12px;padding:12px;margin:8px 0}</style></head><body><div id="boot">BALI STOCK<br><span style="font-size:14px;color:#9fb3a5">Загрузка приложения…</span></div><script>(async()=>{try{const r=await fetch('./v2.html',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let h=await r.text();const inject=`<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script><button id="scanFab">📷 СКАН</button><div id="scanPanel"><div class="scanCard"><div style="display:flex;gap:8px;align-items:center"><b style="font-size:22px;color:#39ff6a;flex:1">QR / ШТРИХКОД</b><button class="scanBtn secondary" id="scanClose">Закрыть</button></div><div id="reader" style="margin-top:12px"></div><input id="manualCode" class="scanInput" placeholder="Или введите код вручную"><button class="scanBtn" id="manualFind">Найти товар</button><div id="scanResult" style="margin-top:12px"></div></div></div><script>let __qr=null;function __findProduct(code){code=String(code||'').trim();let p=(window.S?.products||[]).find(x=>String(x.barcode||'').trim()===code);let out=document.getElementById('scanResult');if(p){out.innerHTML='<div class="scanCard"><b style="font-size:20px">'+esc(p.name)+'</b><div class="muted" style="margin-top:6px">'+esc(p.category_name||'')+'</div><div class="amount" style="margin-top:8px">'+(p.balance?.initialized?parts(Number(p.balance.quantity_base||0),p):'Остаток не введён')+'</div><div class="muted" style="margin-top:6px">Код: '+esc(code)+'</div></div>';return}out.innerHTML='<div class="scanCard"><b>Код не найден</b><div class="muted" style="margin-top:6px">'+esc(code)+'</div><button id="bindCode" class="scanBtn" style="margin-top:10px">Привязать к товару</button></div>';document.getElementById('bindCode').onclick=()=>__bindCode(code)}async function __bindCode(code){try{if(typeof api!=='function')throw Error('API не готов');let opts=(window.S?.products||[]).map(p=>'<option value="'+esc(keyOf(p))+'">'+esc((p.category_name||'')+' — '+p.name)+'</option>').join('');openModal('<h2>Привязать код</h2><select id="bindProd" class="input">'+opts+'</select><button id="bindOk" style="width:100%;margin-top:10px">Сохранить</button>');document.getElementById('bindOk').onclick=async()=>{let k=document.getElementById('bindProd').value,p=(window.S?.products||[]).find(x=>keyOf(x)===k);if(!p)return;await api('authorize',{},true);await api('product_meta',{employee:'iPhone scanner',product_key:keyOf(p),minimum_amount:Number(p.minimum_amount||0),target_amount:Number(p.target_amount||0),default_cost:p.default_cost??null,cost_currency:p.cost_currency||'BYN',barcode:code,variance_recheck_amount:Number(p.variance_recheck_amount||0)},true);closeModal();await snapshot();__findProduct(code)}}catch(e){toast(String(e.message||e),true)}}async function __startScanner(){document.getElementById('scanPanel').style.display='block';document.getElementById('scanResult').innerHTML='';try{if(!window.Html5Qrcode)throw Error('Модуль сканера не загрузился');__qr=new Html5Qrcode('reader');await __qr.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:180}},async code=>{try{await __qr.stop()}catch(e){}__findProduct(code)},()=>{})}catch(e){document.getElementById('scanResult').innerHTML='<div class="error">'+String(e.message||e)+'</div>'}}async function __closeScanner(){try{if(__qr)await __qr.stop()}catch(e){}__qr=null;document.getElementById('scanPanel').style.display='none'}document.getElementById('scanFab').onclick=__startScanner;document.getElementById('scanClose').onclick=__closeScanner;document.getElementById('manualFind').onclick=()=>__findProduct(document.getElementById('manualCode').value);<\/script>`;h=h.replace('</body>',inject+'</body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('boot').innerHTML='BALI STOCK<br><span style="font-size:14px;color:#ff8d94">Ошибка запуска: '+String(e.message||e)+'</span>'}})();</script></body></html>
