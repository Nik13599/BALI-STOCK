<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BALI STOCK"><meta name="theme-color" content="#07110c"><title>BALI STOCK V16</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07110c;color:#f8fff9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.boot{width:min(430px,100%);padding:24px;border:1px solid #294233;border-radius:22px;background:#101c15}.logo{font-size:29px;font-weight:950;color:#39ff6a}.msg{margin-top:10px;color:#9fb3a5;line-height:1.45}.bad{color:#ff8d94}.retry{width:100%;margin-top:16px;padding:13px;border:0;border-radius:13px;background:#39ff6a;color:#031408;font:inherit;font-weight:900}</style></head><body><div class="boot"><div class="logo">BALI STOCK</div><div id="bootMessage" class="msg">Подготавливаю V16…</div></div>
<script>
(async()=>{const R='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime',G='https://raw.githack.com/Nik13599/BALI-STOCK/production/ios-web/',F=['v15-ui.js','v15-delivery-link.js','v15-compat.js','v16-catalog-history.js'],M=document.getElementById('bootMessage'),T=Date.now();try{const A=await Promise.all([fetch(R+'?launcher=16&ts='+T,{cache:'no-store',headers:{Accept:'text/plain,*/*'}}),...F.map(x=>fetch(G+x+'?v='+T,{cache:'no-store'}))]);if(A.some(x=>!x.ok))throw Error('Не удалось получить один из модулей V16');let H=await A[0].text(),J=await Promise.all(A.slice(1).map(x=>x.text()));
if(!/^\s*<!doctype html>/i.test(H)||!H.includes('BALI STOCK'))throw Error('Runtime вернул неверный формат');if(/return,[A-Za-z_$][A-Za-z0-9_$]*=/.test(H))throw Error('Проверка Safari не пройдена');if(!H.includes('async function snapshot')||!H.includes('baseSnapshot=snapshot'))throw Error('Не загружен модуль синхронизации');const K=['__BALI_STOCK_V15_UI__','__BALI_STOCK_V15_DELIVERY_LINK__','__BALI_STOCK_V15_COMPAT__','__BALI_STOCK_V16_CATALOG_HISTORY__'];if(J.some((x,i)=>!x.includes(K[i])))throw Error('Получен неполный V16 модуль');
const E=(s,id)=>'<script id="'+id+'">'+s.replace(/<\/script/gi,'<\\/script')+'<\/script>';H=H.replace('</body>',E(J[0],'bali-v15-ui')+E(J[1],'bali-v15-delivery-link')+E(J[2],'bali-v15-compat')+E(J[3],'bali-v16-catalog-history')+'</body>');document.open();document.write(H);document.close()}catch(e){M.className='msg bad';M.textContent='Не удалось загрузить BALI STOCK: '+(e&&e.message?e.message:String(e));const b=document.createElement('button');b.className='retry';b.textContent='Повторить';b.onclick=()=>location.reload();M.parentNode.appendChild(b)}})();
</script></body></html>
