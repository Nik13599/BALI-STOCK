<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BALI STOCK">
<meta name="theme-color" content="#07110c">
<title>BALI STOCK</title>
<style>
html,body{margin:0;min-height:100%;background:#07110c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px;box-sizing:border-box}
.logo{font-size:30px;font-weight:900;letter-spacing:.4px;color:#39ff6a}
.status{margin-top:12px;color:#a8bbb0;font-size:14px;line-height:1.5;max-width:340px}
.spinner{width:32px;height:32px;margin:20px auto 0;border:3px solid #294233;border-top-color:#39ff6a;border-radius:50%;animation:s .8s linear infinite}
.retry{display:none;margin:18px auto 0;border:0;border-radius:14px;padding:12px 18px;background:#39ff6a;color:#07110c;font-weight:900;font-size:15px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="boot"><div><div class="logo">BALI STOCK</div><div id="status" class="status">Загрузка приложения…</div><div id="spinner" class="spinner"></div><button id="retry" class="retry" type="button">Повторить</button></div></div>
<script>
(async()=>{
  const SOURCE='https://mvnxfouyoynqyjdpcblh.supabase.co/storage/v1/object/public/bali-stock-runtime/production/bali-stock.html';
  const CACHE='bali-stock-ios-runtime-cache-v107';
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  const spinner=document.getElementById('spinner');
  retry.onclick=()=>location.reload();

  function fail(message){
    status.textContent=message;
    spinner.style.display='none';
    retry.style.display='inline-block';
  }

  function validate(html){
    return /^\s*<!doctype html>/i.test(html)
      && html.includes('BALI STOCK')
      && html.includes('__BALI_STOCK_SUPABASE_RUNTIME__')
      && html.includes('bali-stock-client-api');
  }

  function launch(html){
    if(!validate(html)) throw new Error('INVALID_RUNTIME');
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    location.replace(url);
  }

  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),20000);
    const response=await fetch(SOURCE+'?iphone='+Date.now(),{
      cache:'no-store',
      headers:{Accept:'text/plain,*/*'},
      signal:controller.signal
    });
    clearTimeout(timer);
    if(!response.ok) throw new Error('HTTP_'+response.status);
    const html=await response.text();
    if(!validate(html)) throw new Error('INVALID_RUNTIME');
    try{localStorage.setItem(CACHE,html)}catch(_){}
    launch(html);
  }catch(error){
    try{
      const saved=localStorage.getItem(CACHE);
      if(saved && validate(saved)){
        status.textContent='Открываю сохранённую рабочую версию…';
        launch(saved);
        return;
      }
    }catch(_){}
    fail('Не удалось загрузить BALI STOCK. Проверьте интернет и нажмите «Повторить».');
  }
})();
</script>
</body>
</html>
