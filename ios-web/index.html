<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BALI STOCK">
  <meta name="theme-color" content="#07110c">
  <title>BALI STOCK</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07110c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .boot b{display:block;font-size:28px;margin-bottom:10px;color:#39FF6A}.boot span{color:#a7b8ae}
  </style>
</head>
<body>
  <div class="boot"><div><b>BALI STOCK</b><span>Подключение к общему складу…</span></div></div>
  <script>
  (async function(){
    const source='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios?v=2';
    const base='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios';
    try{
      const response=await fetch(source,{cache:'no-store'});
      if(!response.ok) throw new Error('HTTP '+response.status);
      let html=await response.text();
      html=html.replace('<head>','<head><base href="'+base+'">');
      html=html.replace('</head>',`<style>
        .cat{font-size:24px!important;font-weight:900!important;color:#39FF6A!important;letter-spacing:.6px!important;margin:26px 2px 10px!important;line-height:1.15!important;cursor:pointer!important;user-select:none;text-transform:uppercase!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important}
        .cat::after{content:'▾';font-size:20px;color:#39FF6A;opacity:.95}
        .cat[data-collapsed="1"]::after{content:'▸'}
      </style></head>`);
      html=html.replace('</body>',`<script>
        document.addEventListener('click',function(e){
          var cat=e.target.closest&&e.target.closest('.cat');
          if(!cat)return;
          var collapsed=cat.getAttribute('data-collapsed')==='1';
          cat.setAttribute('data-collapsed',collapsed?'0':'1');
          var n=cat.nextElementSibling;
          while(n&&!n.classList.contains('cat')){
            if(n.classList.contains('card'))n.style.display=collapsed?'':'none';
            n=n.nextElementSibling;
          }
        });
      <\/script></body>`);
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.body.innerHTML='<div class="boot"><div><b>BALI STOCK</b><span>Не удалось загрузить приложение.<br>Проверьте интернет и откройте приложение ещё раз.<br><br>'+String(error.message||error)+'</span></div></div>';
    }
  })();
  </script>
</body>
</html>
