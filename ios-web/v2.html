<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>BALI STOCK</title>
<style>
:root{--bg:#07110c;--card:#101c15;--card2:#15271c;--line:#294233;--text:#f8fff9;--muted:#9fb3a5;--green:#39ff6a;--red:#ff5e68;--amber:#ffcb5c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:88px}button,input,select,textarea{font:inherit}button{border:0;border-radius:13px;padding:11px 14px;font-weight:800;background:var(--green);color:#031408}button.secondary{background:#183522;color:var(--green);border:1px solid #2a6240}button.danger{background:#411b20;color:#ff9da4}button:disabled{opacity:.45}.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(7,17,12,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.brand{font-size:21px;font-weight:1000;letter-spacing:.6px;color:var(--green)}.status{margin-left:auto;font-size:12px;color:var(--muted)}.status.ok{color:var(--green)}.wrap{padding:15px;max-width:1100px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.input{width:100%;background:#0c1710;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:10px}.cat{font-size:24px;font-weight:1000;color:var(--green);letter-spacing:.6px;margin:25px 1px 9px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}.cat small{font-size:12px;color:#6ce98b}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.name{font-weight:900;font-size:16px}.muted{color:var(--muted);font-size:13px}.amount{font-weight:900;margin-top:5px}.low{color:var(--red)}.unknown{color:var(--amber)}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:7px 5px calc(env(safe-area-inset-bottom) + 7px);background:rgba(7,17,12,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.tabs button{background:transparent;color:var(--muted);padding:7px 2px;font-size:10px;border-radius:10px}.tabs button.active{color:var(--green);background:#11281a}.tabs b{display:block;font-size:18px;margin-bottom:2px}.section{display:none}.section.active{display:block}.metric{min-width:125px;background:var(--card2);border:1px solid var(--line);padding:12px;border-radius:15px}.metric b{display:block;font-size:22px}.progress{height:9px;background:#18241b;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.lineedit{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px;gap:7px;align-items:center}.lineedit input{padding:9px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#1b3826;color:#9cffb4;font-size:11px;font-weight:800}.warn{color:var(--amber)}.error{color:var(--red)}.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#0c1710;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px;padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}.sheet h2{margin-top:0}.listbtn{width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);margin-bottom:7px}.signature{height:170px;background:#fff;border-radius:12px;touch-action:none;width:100%}@media(max-width:520px){.grid2{grid-template-columns:1fr}.lineedit{grid-template-columns:1fr 70px 70px}.wrap{padding:12px}.tabs button{font-size:9px}.cat{font-size:21px}}@media print{.tabs,.top,.noPrint,button{display:none!important}body{background:#fff;color:#000;padding:0}.card{break-inside:avoid;background:#fff;border-color:#ccc}.cat{color:#08742d}.muted{color:#555}.wrap{max-width:none}.section{display:none!important}.section.printing{display:block!important}}
</style>

<body>
<header class="top"><div class="brand">BALI STOCK</div><div id="sync" class="status">подключение…</div></header>
<main id="app" class="wrap"></main>
<nav class="tabs" id="tabs">
<button data-tab="stock" class="active"><b>▣</b>Склад</button><button data-tab="delivery"><b>⇩</b>Поставка</button><button data-tab="count"><b>✓</b>Переучёт</button><button data-tab="buy"><b>🛒</b>Закупки</button><button data-tab="history"><b>↻</b>История</button><button data-tab="control"><b>⚙</b>Контроль</button>
</nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>
<script>
const API='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-api';
const INVOICE_VIEW='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-invoice-view';
const KEY='sb_publishable_Tq2niBP0_2KuzTEuip8Oeg_1HhCUo29';
let S={version:0,products:[],operations:[],drafts:[],suppliers:[],product_suppliers:[],locations:[],location_balances:[],purchase_suggestions:[],purchase_requests:[],analytics:{}};
let tab='stock', pin=null, delivery={lines:[],file:null,rawText:''}, count=null, countTimer=null, countSyncTimer=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=v=>Number(v||0), text=v=>v==null?'':String(v), keyOf=p=>`${p.name.trim().toLowerCase()}|${p.stock_unit}|${p.package_size}`;
function balance(p){return p.balance||{} } function qty(p){return n(balance(p).quantity_base)} function init(p){return balance(p).initialized===true}
function unit(p){return p.stock_unit==='g'?'г':p.stock_unit==='pcs'?'шт.':'мл'} function packLabel(p){return p.stock_unit==='g'?'уп.':p.stock_unit==='pcs'?'шт.':'бут.'}
function packSize(p){if(p.stock_unit==='pcs')return 'поштучно';if(p.stock_unit==='g')return p.package_size>=1000?`${p.package_size/1000} кг`:`${p.package_size} г`;return p.package_size>=1000?`${p.package_size/1000} л`:`${String(p.package_size/1000).replace('.',',')} л`}
function parts(q,p){if(p.stock_unit==='pcs')return `${q} шт.`;let w=Math.floor(q/p.package_size),e=q%p.package_size;return `${w} ${packLabel(p)} × ${packSize(p)} + ${e} ${unit(p)}`}
function money(v,c='BYN'){return `${Number(v||0).toFixed(2).replace('.',',')} ${c}`}
function dt(v){let d=new Date(v);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function dur(sec){sec=n(sec);let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h} ч ${String(m).padStart(2,'0')} мин`:`${m} мин`}
async function api(action,body={},needPin=false){let headers={apikey:KEY,Accept:'application/json','Content-Type':'application/json'};if(needPin){if(!pin)pin=await ask('Введите пароль доступа','password');if(!pin)throw Error('Пароль не введён');headers['x-bali-stock-pin']=pin}let r=await fetch(API,{method:'POST',headers,body:JSON.stringify({action,...body})});let d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)pin=null;throw Error(d.error||`HTTP ${r.status}`)}return d}
async function snapshot(){try{let r=await fetch(`${API}?action=snapshot`,{headers:{apikey:KEY,Accept:'application/json'},cache:'no-store'});let d=await r.json();if(!r.ok)throw Error(d.error||r.status);S=d;$('#sync').textContent='● синхронизировано';$('#sync').className='status ok';render();return d}catch(e){$('#sync').textContent='● нет связи';$('#sync').className='status error';throw e}}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('open')}function closeModal(){ $('#modal').classList.remove('open');$('#sheet').innerHTML='' } $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function ask(label,type='text',initial=''){return new Promise(res=>{openModal(`<h2>${esc(label)}</h2><input id="askv" class="input" type="${type}" value="${esc(initial)}"><div class="toolbar" style="margin-top:12px"><button id="askok">OK</button><button id="askcancel" class="secondary">Отмена</button></div>`);setTimeout(()=>$('#askv').focus(),50);$('#askok').onclick=()=>{let v=$('#askv').value;closeModal();res(v)};$('#askcancel').onclick=()=>{closeModal();res(null)}})}
function confirmBox(title,msg){return new Promise(res=>{openModal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="toolbar"><button id="yes">Подтвердить</button><button id="no" class="secondary">Отмена</button></div>`);$('#yes').onclick=()=>{closeModal();res(true)};$('#no').onclick=()=>{closeModal();res(false)}})}
function toast(msg,err=false){let d=document.createElement('div');d.textContent=msg;d.style=`position:fixed;z-index:99;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 62px);padding:13px;border-radius:14px;background:${err?'#501c22':'#143520'};color:white;font-weight:800`;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();if(t==='history'||t==='buy'||t==='control')snapshot().catch(()=>{})}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){let f={stock:renderStock,delivery:renderDelivery,count:renderCount,buy:renderBuy,history:renderHistory,control:renderControl}[tab];$('#app').innerHTML=`<section class="section active" id="section">${f()}</section>`;wire()}
function wire(){if(tab==='stock')wireStock();if(tab==='delivery')wireDelivery();if(tab==='count')wireCount();if(tab==='buy')wireBuy();if(tab==='history')wireHistory();if(tab==='control')wireControl()}
function printSection(){document.querySelector('.section').classList.add('printing');window.print();setTimeout(()=>document.querySelector('.section')?.classList.remove('printing'),500)}
function groupProducts(list=S.products){let m={};list.filter(p=>p.active!==false).forEach(p=>(m[p.category_name]??=[]).push(p));return m}
function renderStock(){let groups=groupProducts();let html=`<div class="toolbar noPrint"><input id="stockSearch" class="input grow" placeholder="Поиск"><button id="stockPdf" class="secondary">PDF</button></div><div class="row noPrint" style="flex-wrap:wrap"><div class="metric"><span class="muted">Позиций</span><b>${S.products.length}</b></div><div class="metric"><span class="muted">Критический</span><b>${S.products.filter(p=>init(p)&&qty(p)<=n(p.minimum_amount)).length}</b></div></div>`;for(let [cat,items] of Object.entries(groups)){html+=`<div class="cat" data-cat="${esc(cat)}"><span>${esc(cat)}</span><small>${items.length} поз.</small></div><div class="catbody">`;for(let p of items){let status=!init(p)?'unknown':qty(p)<=n(p.minimum_amount)?'low':'';html+=`<div class="card product" data-search="${esc((p.name+' '+p.category_name).toLowerCase())}"><div class="row"><div class="grow"><div class="name">${esc(p.name)}</div><div class="muted">${esc(packSize(p))} • минимум ${n(p.minimum_amount)} ${unit(p)}${n(p.target_amount)>0?` • цель ${n(p.target_amount)} ${unit(p)}`:''}</div><div class="amount ${status}">${!init(p)?'Остаток не введён':esc(parts(qty(p),p))}</div></div><button class="secondary noPrint ph" data-key="${esc(keyOf(p))}">История</button></div></div>`}html+='</div>'}return html}
function wireStock(){$('#stockPdf').onclick=printSection;$('#stockSearch').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.product').forEach(x=>x.style.display=x.dataset.search.includes(q)?'':'none')};document.querySelectorAll('.cat').forEach(h=>h.onclick=()=>{let b=h.nextElementSibling;b.style.display=b.style.display==='none'?'':'none'});document.querySelectorAll('.ph').forEach(b=>b.onclick=()=>showProductHistory(b.dataset.key))}
function renderDelivery(){let sups=S.suppliers.filter(x=>x.active!==false),locs=S.locations.filter(x=>x.active!==false);return `<h2>Принять поставку</h2><div class="card"><input id="delEmp" class="input" placeholder="Сотрудник, ФИО *"><div class="grid2" style="margin-top:9px"><select id="delSup" class="input"><option value="">Поставщик не указан</option>${sups.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><select id="delLoc" class="input">${locs.map(l=>`<option value="${l.id}" ${l.is_primary?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><input id="delDoc" class="input" style="margin-top:9px" placeholder="Номер накладной / ТТН"><textarea id="delComment" class="input" style="margin-top:9px" placeholder="Комментарий"></textarea></div><div class="toolbar"><label class="secondary" style="padding:11px 14px;border-radius:13px;font-weight:800"><input id="invoiceFile" type="file" accept="image/*" capture="environment" hidden>📷 Фото / скан накладной</label><button id="ocrBtn" class="secondary">Распознать накладную</button><button id="manualLine">Ввести вручную</button><button id="addSup" class="secondary">+ Поставщик</button></div><div id="ocrState" class="muted">${delivery.rawText?'OCR выполнен. Проверьте каждую строку.':''}</div><div id="delLines">${delivery.lines.map(delLineHtml).join('')}</div><button id="submitDelivery" ${delivery.lines.length?'':'disabled'} style="width:100%;margin-top:14px">ПРОВЕСТИ ПОСТАВКУ</button>`}
function delLineHtml(l,i){let p=S.products.find(x=>keyOf(x)===l.product_key);if(!p)return'';return `<div class="card"><div class="name">${esc(p.name)} ${l.confidence!=null?`<span class="pill ${l.confidence<.72?'warn':''}">${l.corrected?'проверено':Math.round(l.confidence*100)+'%'}</span>`:''}</div><div class="muted">${esc(p.category_name)}${l.source?` • OCR: ${esc(l.source)}`:''}</div><div class="lineedit" style="margin-top:8px"><span>${p.stock_unit==='pcs'?'Количество':packLabel(p)}</span><input class="input dlw" data-i="${i}" type="number" min="0" value="${l.whole}">${p.stock_unit==='pcs'?'<span></span>':`<input class="input dle" data-i="${i}" type="number" min="0" max="${p.package_size-1}" value="${l.extra}">`}</div><div class="row" style="margin-top:8px"><input class="input dlc" data-i="${i}" inputmode="decimal" placeholder="Цена за упаковку" value="${l.cost??''}"><button class="danger delrow" data-i="${i}">Удалить</button></div></div>`}
function wireDelivery(){let f=$('#invoiceFile');f.onchange=()=>{delivery.file=f.files[0]||null;$('#ocrState').textContent=delivery.file?`Выбран файл: ${delivery.file.name}`:''};$('#ocrBtn').onclick=runOcr;$('#manualLine').onclick=()=>manualDeliveryLine();$('#addSup').onclick=addSupplier;document.querySelectorAll('.dlw').forEach(x=>x.oninput=()=>{let l=delivery.lines[x.dataset.i];l.whole=Math.max(0,n(x.value));l.corrected=true});document.querySelectorAll('.dle').forEach(x=>x.oninput=()=>{let l=delivery.lines[x.dataset.i];l.extra=Math.max(0,n(x.value));l.corrected=true});document.querySelectorAll('.dlc').forEach(x=>x.oninput=()=>{delivery.lines[x.dataset.i].cost=x.value});document.querySelectorAll('.delrow').forEach(x=>x.onclick=()=>{delivery.lines.splice(n(x.dataset.i),1);render()});$('#submitDelivery').onclick=submitDelivery}
async function manualDeliveryLine(){let p=await chooseProduct('Выберите позицию');if(!p)return;let w=await ask(p.stock_unit==='pcs'?'Количество, шт.':`Количество ${packLabel(p)}`,'number','0');if(w==null)return;let e=p.stock_unit==='pcs'?0:await ask(`Доп. остаток, ${unit(p)}`,'number','0');if(e==null)return;delivery.lines.push({product_key:keyOf(p),whole:n(w),extra:n(e),cost:null,corrected:true});render()}
async function addSupplier(){try{await api('authorize',{},true);let name=await ask('Название нового поставщика');if(!name)return;let phone=await ask('Телефон поставщика (необязательно)')||'';await api('supplier_upsert',{name,phone},true);toast('Поставщик добавлен');await snapshot()}catch(e){toast(e.message,true)}}
function normalize(s){return String(s).toLowerCase().replaceAll('ё','е').replace(/[^a-zа-я0-9]+/g,' ').trim()}function matchScore(a,b){a=normalize(a);b=normalize(b);if(!a||!b)return 0;if(b.includes(a))return 1;let aa=a.split(' ').filter(x=>x.length>1),bb=new Set(b.split(' ').filter(x=>x.length>1)),c=aa.filter(x=>bb.has(x)).length;return c/Math.max(1,aa.length)}
function qFromLine(line,p){let m=[...line.toLowerCase().replaceAll('х','x').matchAll(/(\d{1,4}(?:[.,]\d+)?)\s*(шт\.?|штук|бут\.?|бутыл\w*|уп\.?|упак\w*|pcs?|btl)/g)].pop();if(m){let w=Math.round(Number(m[1].replace(',','.')));return{whole:w,extra:0,conf:.98}}let nums=[...line.matchAll(/(?<![.,\d])(\d{1,4})(?![.,\d])/g)].map(x=>Number(x[1])).filter(x=>x>0&&x<=500&&x!==n(p.package_size));if(nums.length)return{whole:nums[nums.length-1],extra:0,conf:.62};return null}
async function runOcr(){if(!delivery.file){toast('Сначала выберите фото накладной',true);return}try{$('#ocrState').textContent='Распознавание rus+eng…';let worker=await Tesseract.createWorker(['rus','eng']);let r=await worker.recognize(delivery.file);await worker.terminate();delivery.rawText=r.data.text||'';let lines=delivery.rawText.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x.length>2),found=[];for(let p of S.products.filter(x=>x.active!==false)){let bi=-1,bs=0;for(let i=0;i<lines.length;i++){let s=matchScore(p.name,lines[i]);if(s>bs){bs=s;bi=i}}if(bs<.5)continue;let q=qFromLine(lines[bi],p);if(!q)continue;found.push({product_key:keyOf(p),whole:q.whole,extra:q.extra,cost:null,source:lines[bi],confidence:bs*.72+q.conf*.28,corrected:false})}delivery.lines=found;toast(`Распознано позиций: ${found.length}. Обязательно сверьте.`);render()}catch(e){toast('OCR: '+e.message,true);$('#ocrState').textContent='Ошибка распознавания'}}
async function fileBase64(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function submitDelivery(){try{let employee=$('#delEmp').value.trim();if(!employee)throw Error('Укажите ФИО сотрудника');let bad=delivery.lines.filter(x=>x.confidence!=null&&x.confidence<.55&&!x.corrected);if(bad.length&&!await confirmBox('Проверить OCR',`${bad.length} строк имеют низкую уверенность. Вы действительно сверили их с накладной?`))return;await api('authorize',{},true);let attachment=null;if(delivery.file){let b64=await fileBase64(delivery.file);let up=await api('invoice_attachment_upload',{file_name:delivery.file.name,mime_type:delivery.file.type||'image/jpeg',data_base64:b64},true);attachment=up.path}let scanId=null;if(delivery.rawText){let sr=await api('invoice_scan_save',{employee,supplier_id:$('#delSup').value||null,document_number:$('#delDoc').value||null,attachment_url:attachment,raw_text:delivery.rawText,status:'reviewed',lines:delivery.lines.map(l=>{let p=S.products.find(x=>keyOf(x)===l.product_key);return{source_text:l.source||p.name,product_key:l.product_key,recognized_quantity:p.stock_unit==='pcs'?l.whole:l.whole*p.package_size+l.extra,recognized_packages:l.whole,unit_cost:l.cost?Number(String(l.cost).replace(',','.')):null,confidence:l.confidence,manually_corrected:!!l.corrected}})},true);scanId=sr.id}let body={employee,supplier_id:$('#delSup').value||null,document_number:$('#delDoc').value||null,comment:$('#delComment').value||null,attachment_url:attachment,location_id:$('#delLoc').value||null,metadata:{invoice_scan_id:scanId,ocr_used:!!delivery.rawText},lines:delivery.lines.map(l=>{let p=S.products.find(x=>keyOf(x)===l.product_key);return{product_key:l.product_key,quantity_base:p.stock_unit==='pcs'?l.whole:l.whole*p.package_size+l.extra,unit_cost:l.cost?Number(String(l.cost).replace(',','.')):null,currency:p.cost_currency||'BYN',metadata:{ocr_source:l.source||null,ocr_confidence:l.confidence??null,manually_corrected:!!l.corrected}}})};let r=await api('delivery',body,true);S=r.snapshot;delivery={lines:[],file:null,rawText:''};toast('Поставка проведена. Остатки обновлены у всех.');setTab('stock')}catch(e){toast(e.message,true)}}

async function quantityFor(p,title){let w=await ask(`${title}: ${p.name}\n${p.stock_unit==='pcs'?'Количество, шт.':'Количество '+packLabel(p)}`,'number','0');if(w==null)return null;let e=p.stock_unit==='pcs'?0:await ask(`Доп. остаток, ${unit(p)}`,'number','0');if(e==null)return null;let q=p.stock_unit==='pcs'?n(w):n(w)*n(p.package_size)+n(e);if(q<=0)throw Error('Количество должно быть больше нуля');return{product_key:keyOf(p),quantity_base:q}}
async function writeoff(){try{await api('authorize',{},true);let emp=await ask('ФИО сотрудника');if(!emp)return,p=await chooseProduct('Что списать');if(!p)return,q=await quantityFor(p,'Списание');if(!q)return,reason=await ask('Причина списания','text','Бой');if(!reason)return;await api('writeoff',{employee:emp,reason,location_id:(S.locations.find(x=>x.is_primary)||S.locations[0])?.id,lines:[q]},true);toast('Списание проведено');await snapshot()}catch(e){toast(e.message,true)}}
async function transfer(){try{if(S.locations.length<2)throw Error('Добавьте минимум два места хранения');await api('authorize',{},true);let emp=await ask('ФИО сотрудника');if(!emp)return,p=await chooseProduct('Что переместить');if(!p)return,q=await quantityFor(p,'Перемещение');if(!q)return;let src=S.locations.find(x=>x.is_primary)||S.locations[0],dst=S.locations.find(x=>x.id!==src.id);await api('transfer',{employee:emp,source_location_id:src.id,target_location_id:dst.id,lines:[q]},true);toast(`Перемещено: ${src.name} → ${dst.name}`);await snapshot()}catch(e){toast(e.message,true)}}
async function editProductControl(){try{await api('authorize',{},true);let p=S.products.find(x=>keyOf(x)===$('#ctlProd').value);if(!p)return,emp=await ask('ФИО сотрудника');if(!emp)return,min=await ask(`Минимальный остаток, ${unit(p)}`,'number',String(n(p.minimum_amount)));if(min==null)return,target=await ask(`Целевой остаток, ${unit(p)}`,'number',String(n(p.target_amount)));if(target==null)return,cost=await ask('Закупочная цена, BYN','number',String(p.default_cost??''));if(cost==null)return,barcode=await ask('Штрихкод / QR', 'text', p.barcode||'');if(barcode==null)return;await api('product_meta',{employee:emp,product_key:keyOf(p),minimum_amount:n(min),target_amount:n(target),default_cost:cost===''?null:Number(String(cost).replace(',','.')),cost_currency:'BYN',barcode,variance_recheck_amount:n(p.variance_recheck_amount)},true);toast('Настройки товара сохранены');await snapshot()}catch(e){toast(e.message,true)}}
function showProductHistory(k){let p=S.products.find(x=>keyOf(x)===k),rows=[];S.operations.forEach(o=>(o.lines||[]).forEach(l=>{if(l.product_key===k)rows.push({o,l})}));openModal(`<h2>${esc(p?.name||'История позиции')}</h2>${rows.map(x=>`<div class="card"><b>${esc(opName(x.o.operation_type))}</b><div class="muted">${dt(x.o.created_at)}</div><div>Было ${n(x.l.before_quantity)} • изменение ${n(x.l.change_quantity)>=0?'+':''}${n(x.l.change_quantity)} • стало ${n(x.l.after_quantity)} ${x.l.stock_unit}</div></div>`).join('')||'<p>Движений пока нет.</p>'}<button onclick="closeModal()" class="secondary" style="width:100%">Закрыть</button>`)}
(async()=>{try{await snapshot();setInterval(()=>snapshot().catch(()=>{}),5000)}catch(e){toast(e.message,true);render()}})();
</script>
</body></html>
