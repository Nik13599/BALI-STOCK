name: Recover BALI STOCK iPhone Web App

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bali-stock-iphone-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build current iPhone runtime
        run: |
          python tool/build_ios_production_runtime.py --output dist/pages/index.html
          touch dist/pages/.nojekyll
      - name: Validate camera-safe document
        run: |
          grep -q '__BALI_STOCK_IOS_SCANNER_COMPAT__' dist/pages/index.html
          grep -q '__BALI_STOCK_VISUAL_CONTRACT__' dist/pages/index.html
          grep -q 'bali-html5-qrcode-v238' dist/pages/index.html
          ! grep -q 'cdn.jsdelivr.net/npm/html5-qrcode' dist/pages/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
