name: Export BALI STOCK Production V1

on:
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p export/release export/signing
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir export/release
          test -f export/release/BALI-STOCK-Windows-Setup.exe
          test -f export/release/BALI-STOCK-Android.apk
          test -f export/release/BALI-STOCK-iPhone.mobileconfig
          test -f export/release/BALI-STOCK-SHA256.txt
      - name: Download one-time Android production signing backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'Release BALI STOCK Production' --branch main --limit 1 --json databaseId,status,conclusion --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "Production run: $RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name production-android-signing-backup-encrypted --dir export/signing
          test -f export/signing/BALI-STOCK-Android-Production-Key.jks.enc
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-Production-V1-Export
          path: export/**
          if-no-files-found: error
          retention-days: 1
