name: iPhone Runtime Smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: bali-stock-iphone-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate iPhone launcher and compact product card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('ios-web/launch-v14-3.html').read_text(encoding='utf-8')
          required = [
              '__BALI_V14_COMPACT_PRODUCT_CARD__',
              'window.v14ShowProduct=compact',
              'ПЕРЕУЧЕСТЬ ТОВАР',
              '<summary>Экономика</summary>',
              '<summary>История карточки</summary>',
              '@media(max-width:520px)',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'Compact product-card launcher contract missing: {missing!r}')

          outer = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', source, flags=re.I)
          if not outer:
              raise SystemExit('Launcher inline JavaScript not found')
          for index, script in enumerate(outer):
              Path(f'/tmp/bali-launcher-outer-{index}.js').write_text(script, encoding='utf-8')

          nested = re.search(
              r'const compactProductCard = `<script[^>]*>\n([\s\S]*?)\n<\\/script>`;',
              source,
          )
          if not nested:
              raise SystemExit('Nested compact product-card script not found')
          Path('/tmp/bali-launcher-compact-card.js').write_text(nested.group(1), encoding='utf-8')
          print(f'Launcher contract OK; outer scripts={len(outer)}')
          PY
          for file in /tmp/bali-launcher-outer-*.js /tmp/bali-launcher-compact-card.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Fetch production iPhone runtime
        run: |
          curl --fail --silent --show-error \
            "https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime?ci=${GITHUB_RUN_ID}" \
            -o /tmp/bali-stock-ios-runtime.html
          test -s /tmp/bali-stock-ios-runtime.html
          grep -qi '^<!doctype html>' /tmp/bali-stock-ios-runtime.html
      - name: Validate runtime contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('/tmp/bali-stock-ios-runtime.html').read_text(encoding='utf-8')
          legacy = re.findall(r'return,[A-Za-z_$][A-Za-z0-9_$]*=', html)
          if legacy:
              raise SystemExit(f'Legacy Safari syntax remains: {legacy[:5]}')
          if 'async function snapshot' not in html:
              raise SystemExit('snapshot() is missing')
          if 'baseSnapshot=snapshot' not in html:
              raise SystemExit('V14 snapshot binding is missing')

          match = re.search(r"nav\.innerHTML='<button data-tab=\"home\" class=\"active\">[\s\S]*?</button>';", html)
          if not match:
              raise SystemExit('V14 runtime navigation not found')
          nav = match.group(0)
          labels = re.findall(r'</b>([^<]+)</button>', nav)
          expected = ['Главная', 'Склад', 'Переучёт', 'Закупки', 'Поставка', 'Настройки']
          if labels != expected:
              raise SystemExit(f'Navigation mismatch: {labels!r}')
          if 'data-tab="history"' in nav:
              raise SystemExit('History must not be a primary tab')
          if '<svg' not in nav:
              raise SystemExit('Custom SVG navigation icons are missing')

          required_scanner_contract = [
              '__BALI_V14_SCAN_WORKFLOWS__',
              'function scanCodeFor(onCode)',
              'Сканировать товар',
              'Ввести код товара',
              'СОХРАНИТЬ → СЛЕДУЮЩИЙ СКАН',
              'ДАННЫЕ ВВЕДЕНЫ',
              'НЕ ВВЕДЕНО',
              'Название / категория / код товара',
              'Закупочная цена обязательна для каждой позиции поставки.',
              "facingMode:'environment'",
          ]
          missing = [item for item in required_scanner_contract if item not in html]
          if missing:
              raise SystemExit(f'Scanner workflow contract missing: {missing!r}')

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if len(scripts) < 4:
              raise SystemExit(f'Expected multiple inline scripts including scanner workflow, got {len(scripts)}')
          for index, script in enumerate(scripts):
              Path(f'/tmp/bali-runtime-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Runtime contract OK; inline scripts={len(scripts)}')
          PY
      - name: Parse every inline JavaScript block
        run: |
          for file in /tmp/bali-runtime-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate production runtime health endpoint
        run: |
          curl --fail --silent --show-error \
            "https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime?health=1&ci=${GITHUB_RUN_ID}" \
            -o /tmp/bali-runtime-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/bali-runtime-health.json').read_text(encoding='utf-8'))
          assert data['ok'] is True, data
          assert data['remaining_legacy_return_comma'] == 0, data
          assert data['snapshot_found'] is True, data
          assert data['snapshot_before_v14'] is True, data
          assert data['scanner_workflows'] is True, data
          assert data['history_in_runtime_nav'] is False, data
          print('Production iPhone runtime health + scanner workflows OK')
          PY