name: iPhone Runtime Smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: bali-stock-iphone-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V15 iPhone launcher and UI modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          launcher = Path('ios-web/launch-v15.html').read_text(encoding='utf-8')
          ui = Path('ios-web/v15-ui.js').read_text(encoding='utf-8')
          delivery = Path('ios-web/v15-delivery-link.js').read_text(encoding='utf-8')
          compat = Path('ios-web/v15-compat.js').read_text(encoding='utf-8')
          required_launcher = [
              'bali-stock-ios-runtime',
              'v15-ui.js',
              'v15-delivery-link.js',
              'v15-compat.js',
              'async function snapshot',
              'baseSnapshot=snapshot',
          ]
          missing = [item for item in required_launcher if item not in launcher]
          if missing:
              raise SystemExit(f'V15 launcher contract missing: {missing!r}')

          required_ui = [
              '__BALI_STOCK_V15_UI__',
              'Поставщик не назначен',
              'Настройки товара',
              'Продажи и цены',
              'Ввести нового поставщика',
              'Категории → товары по алфавиту',
              'Нужно заказать',
              'Все товары',
              'Заявки',
              'Накладная не распознана. Загрузите оригинальную накладную.',
              'Распознаю накладную…',
              'reduceInvoiceImage',
          ]
          missing = [item for item in required_ui if item not in ui]
          if missing:
              raise SystemExit(f'V15 iPhone UI contract missing: {missing!r}')

          required_delivery = [
              '__BALI_STOCK_V15_DELIVERY_LINK__',
              'purchase_request_id',
              'Заявка на закупку — при наличии',
              'received_quantity',
              'prefillRequest',
          ]
          missing = [item for item in required_delivery if item not in delivery]
          if missing:
              raise SystemExit(f'V15 delivery-link contract missing: {missing!r}')

          required_compat = [
              '__BALI_STOCK_V15_COMPAT__',
              "v14Photo: 'v14pcPhoto'",
              "v14Edit: 'v14pcEdit'",
              "v14Spot: 'v14pcStocktake'",
          ]
          missing = [item for item in required_compat if item not in compat]
          if missing:
              raise SystemExit(f'V15 compatibility bridge missing: {missing!r}')

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', launcher, flags=re.I)
          if not scripts:
              raise SystemExit('V15 launcher inline JavaScript not found')
          for index, script in enumerate(scripts):
              Path(f'/tmp/bali-v15-launcher-{index}.js').write_text(script, encoding='utf-8')
          print(f'V15 launcher contract OK; inline scripts={len(scripts)}')
          PY
          node --check ios-web/v15-ui.js
          node --check ios-web/v15-delivery-link.js
          node --check ios-web/v15-compat.js
          for file in /tmp/bali-v15-launcher-*.js; do
            node --check "$file"
          done
      - name: Fetch production iPhone runtime
        run: |
          curl --fail --silent --show-error \
            "https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime?ci=${GITHUB_RUN_ID}" \
            -o /tmp/bali-stock-ios-runtime.html
          test -s /tmp/bali-stock-ios-runtime.html
          grep -qi '^<!doctype html>' /tmp/bali-stock-ios-runtime.html
      - name: Validate runtime contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('/tmp/bali-stock-ios-runtime.html').read_text(encoding='utf-8')
          legacy = re.findall(r'return,[A-Za-z_$][A-Za-z0-9_$]*=', html)
          if legacy:
              raise SystemExit(f'Legacy Safari syntax remains: {legacy[:5]}')
          if 'async function snapshot' not in html:
              raise SystemExit('snapshot() is missing')
          if 'baseSnapshot=snapshot' not in html:
              raise SystemExit('V14 snapshot binding is missing')

          match = re.search(r"nav\.innerHTML='<button data-tab=\"home\" class=\"active\">[\s\S]*?</button>';", html)
          if not match:
              raise SystemExit('V14 runtime navigation not found')
          nav = match.group(0)
          labels = re.findall(r'</b>([^<]+)</button>', nav)
          expected = ['Главная', 'Склад', 'Переучёт', 'Закупки', 'Поставка', 'Настройки']
          if labels != expected:
              raise SystemExit(f'Navigation mismatch: {labels!r}')
          if 'data-tab="history"' in nav:
              raise SystemExit('History must not be a primary tab')
          if '<svg' not in nav:
              raise SystemExit('Custom SVG navigation icons are missing')

          required_scanner_contract = [
              '__BALI_V14_SCAN_WORKFLOWS__',
              'function scanCodeFor(onCode)',
              'Сканировать товар',
              'Ввести код товара',
              'СОХРАНИТЬ → СЛЕДУЮЩИЙ СКАН',
              'ДАННЫЕ ВВЕДЕНЫ',
              'НЕ ВВЕДЕНО',
              'Название / категория / код товара',
              'Закупочная цена обязательна для каждой позиции поставки.',
              "facingMode:'environment'",
          ]
          missing = [item for item in required_scanner_contract if item not in html]
          if missing:
              raise SystemExit(f'Scanner workflow contract missing: {missing!r}')

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if len(scripts) < 4:
              raise SystemExit(f'Expected multiple inline scripts including scanner workflow, got {len(scripts)}')
          for index, script in enumerate(scripts):
              Path(f'/tmp/bali-runtime-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Runtime contract OK; inline scripts={len(scripts)}')
          PY
      - name: Parse every production runtime inline JavaScript block
        run: |
          for file in /tmp/bali-runtime-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate production runtime health endpoint
        run: |
          curl --fail --silent --show-error \
            "https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime?health=1&ci=${GITHUB_RUN_ID}" \
            -o /tmp/bali-runtime-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/bali-runtime-health.json').read_text(encoding='utf-8'))
          assert data['ok'] is True, data
          assert data['remaining_legacy_return_comma'] == 0, data
          assert data['snapshot_found'] is True, data
          assert data['snapshot_before_v14'] is True, data
          assert data['scanner_workflows'] is True, data
          assert data['history_in_runtime_nav'] is False, data
          print('Production iPhone runtime health + V15 local UI modules OK')
          PY
