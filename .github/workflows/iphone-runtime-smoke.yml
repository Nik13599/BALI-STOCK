name: iPhone Runtime Smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: bali-stock-iphone-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate local iPhone UI modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          contracts = {
              'ios-web/v14-scan-workflows.js': [
                  "__BALI_V14_SCAN_WORKFLOWS__='v14.5'",
                  'Назначить код товару',
                  'Найти товар вручную',
                  '__baliResolveProductCode',
              ],
              'ios-web/v15-ui.js': [
                  '__BALI_STOCK_V15_UI__',
                  'Поставщик не назначен',
                  'Настройки товара',
                  'Продажи и цены',
                  'Ввести нового поставщика',
                  'Категории → товары по алфавиту',
                  'Нужно заказать',
                  'Все товары',
                  'Заявки',
                  'Накладная не распознана. Загрузите оригинальную накладную.',
                  'Распознаю накладную…',
                  'reduceInvoiceImage',
              ],
              'ios-web/v15-delivery-link.js': [
                  '__BALI_STOCK_V15_DELIVERY_LINK__',
                  'purchase_request_id',
                  'Заявка на закупку — при наличии',
                  'received_quantity',
                  'prefillRequest',
              ],
              'ios-web/v15-compat.js': [
                  "__BALI_STOCK_V15_COMPAT__ = '15.1'",
                  "v14Photo: 'v14pcPhoto'",
                  "v14Edit: 'v14pcEdit'",
                  "v14Spot: 'v14pcStocktake'",
                  '__BALI_STOCK_SNAPSHOT_FALLBACK__',
                  'window.snapshot = fallbackSnapshot',
                  'window.baliRefreshSnapshot',
                  'bali-custom-nav-icon',
                  'iconPaths',
              ],
              'ios-web/v16-catalog-history.js': [
                  '__BALI_STOCK_V16_CATALOG_HISTORY__',
                  'Редактирование склада',
                  'ДОБАВИТЬ НОВЫЙ ТОВАР',
                  'catalog_product_batch',
                  "api('draft_delete'",
                  "started_at:d.started_at||''",
                  'Удалять можно только черновики',
              ],
          }
          for path, required in contracts.items():
              source = Path(path).read_text(encoding='utf-8')
              missing = [item for item in required if item not in source]
              if missing:
                  raise SystemExit(f'{path} contract missing: {missing!r}')
          print('Local iPhone UI module contracts OK')
          PY
          node --check ios-web/v15-ui.js
          node --check ios-web/v14-scan-workflows.js
          node --check ios-web/v15-delivery-link.js
          node --check ios-web/v15-compat.js
          node --check ios-web/v16-catalog-history.js
          node --check ios-web/ios-scanner-compat.js
          node --check ios-web/ios-runtime-performance.js

      - name: Verify fast iPhone live barcode scanner without photo fallback
        run: node tool/test_ios_live_scanner.js

      - name: Regression test missing snapshot does not crash compat layer
        run: |
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('ios-web/v15-compat.js', 'utf8');
          const document = {
            getElementById() { return null; },
            querySelectorAll() { return []; },
            createElement() { return { id: '', className: '', textContent: '', style: {}, setAttribute() {} }; },
            head: { appendChild() {} },
            body: {},
            documentElement: {},
            readyState: 'complete',
            addEventListener() {},
          };
          function MutationObserver() { this.observe = function () {}; }
          const context = {
            document,
            MutationObserver,
            console,
            setTimeout(fn) { fn(); return 1; },
            clearTimeout() {},
          };
          context.window = context;
          vm.createContext(context);
          vm.runInContext(source, context, { filename: 'v15-compat.js' });
          if (typeof context.snapshot !== 'function') throw new Error('snapshot fallback was not installed');
          if (context.__BALI_STOCK_SNAPSHOT_FALLBACK__ !== true) throw new Error('snapshot fallback marker is not true');
          if (typeof context.baliRefreshSnapshot !== 'function') throw new Error('guarded snapshot helper missing');
          console.log('Missing snapshot regression guard OK');
          JS

      - name: Validate generated iPhone profile keeps the production URL and icon
        run: |
          python tool/generate_mobileconfig.py
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          expected = 'https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime'
          with Path('dist/ios/BALI-STOCK-iPhone.mobileconfig').open('rb') as f:
              profile = plistlib.load(f)
          clip = profile['PayloadContent'][0]
          assert clip['URL'] == expected, clip['URL']
          assert clip['FullScreen'] is True
          assert clip['Icon'] == Path('assets/branding/bali_stock_logo.png').read_bytes()
          print('iPhone profile endpoint OK:', clip['URL'])
          PY
          python tool/visual_contract_check.py --mobileconfig dist/ios/BALI-STOCK-iPhone.mobileconfig

      - name: Build candidate iPhone runtime
        run: |
          python tool/build_ios_production_runtime.py --output /tmp/bali-stock-ios-runtime.html
          test -s /tmp/bali-stock-ios-runtime.html
          grep -qi '^<!doctype html>' /tmp/bali-stock-ios-runtime.html

      - name: Validate self-contained production runtime contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('/tmp/bali-stock-ios-runtime.html').read_text(encoding='utf-8')
          forbidden = [
              'raw.githack.com',
              'raw.githubusercontent.com/Nik13599/BALI-STOCK',
              'cdn.jsdelivr.net/npm/html5-qrcode',
              'Введите пароль доступа',
              'Пароль не введён',
              'Неверный пароль',
              "input.setAttribute('capture', 'environment')",
              'scanner.scanFile(file, true)',
          ]
          remaining = [item for item in forbidden if item in html]
          if remaining:
              raise SystemExit(f'Forbidden runtime dependencies/prompts remain: {remaining!r}')
          legacy = re.findall(r'return,[A-Za-z_$][A-Za-z0-9_$]*=', html)
          if legacy:
              raise SystemExit(f'Legacy Safari syntax remains: {legacy[:5]}')

          required = [
              'BALI STOCK',
              '__BALI_STOCK_SUPABASE_RUNTIME__',
              'bali-stock-client-api',
              '__BALI_V14_SCAN_WORKFLOWS__',
              '__BALI_STOCK_V15_UI__',
              '__BALI_STOCK_V15_DELIVERY_LINK__',
              '__BALI_STOCK_V15_COMPAT__',
              '__BALI_STOCK_V16_CATALOG_HISTORY__',
              '__BALI_STOCK_IOS_SCANNER_COMPAT__',
              '__BALI_STOCK_IOS_LIVE_SCANNER__',
              'formats.EAN_13',
              'config.fps = Math.max(15',
              "focusMode: 'continuous'",
              '__BALI_STOCK_IOS_RUNTIME_PERFORMANCE__',
              '__BALI_STOCK_VISUAL_CONTRACT__',
              'bali-html5-qrcode-v238',
              'baliPollSnapshotVersion',
              'async function snapshot',
              'baseSnapshot=snapshot',
              'СОХРАНИТЬ → СЛЕДУЮЩИЙ СКАН',
              'Закупочная цена обязательна для каждой позиции поставки.',
              'Накладная не распознана. Загрузите оригинальную накладную.',
              'Назначить код товару',
              'Найти товар вручную',
              '__baliResolveProductCode',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Production runtime contract missing: {missing!r}')

          match = re.search(r"nav\.innerHTML='<button data-tab=\"home\" class=\"active\">[\s\S]*?</button>';", html)
          if not match:
              raise SystemExit('Runtime navigation not found')
          nav = match.group(0)
          labels = re.findall(r'</b>([^<]+)</button>', nav)
          expected = ['Главная', 'Склад', 'Переучёт', 'Закупки', 'Поставка', 'Настройки']
          if labels != expected:
              raise SystemExit(f'Navigation mismatch: {labels!r}')
          if 'data-tab="history"' in nav:
              raise SystemExit('History must not be a primary tab')

          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          if len(scripts) < 4:
              raise SystemExit(f'Expected embedded runtime scripts, got {len(scripts)}')
          for index, script in enumerate(scripts):
              Path(f'/tmp/bali-runtime-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Candidate production runtime contract OK; inline scripts={len(scripts)}')
          PY

      - name: Parse every production runtime inline JavaScript block
        run: |
          for file in /tmp/bali-runtime-inline-*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate production runtime health endpoint
        run: |
          curl --fail --silent --show-error \
            "https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime?health=1&ci=${GITHUB_RUN_ID}" \
            -o /tmp/bali-runtime-health.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/bali-runtime-health.json').read_text(encoding='utf-8'))
          assert data['ok'] is True, data
          assert isinstance(data.get('version'), str) and data['version'], data
          assert isinstance(data.get('build'), int) and data['build'] > 0, data
          assert data['web_app'] == 'https://nik13599.github.io/BALI-STOCK/', data
          assert data['interface_guard'] is True, data
          assert data['active_target'] in {
              'https://nik13599.github.io/BALI-STOCK/',
              'https://raw.githack.com/Nik13599/BALI-STOCK/777265e6a60fe643e358df16484c073f061bf93b/ios-web/iphone-launcher-v107.html',
          }, data
          assert data['github_dependency'] is True, data
          if data['source'] == 'github-pages':
              assert data['camera_safe_origin'] is True, data
              assert data['blob_launcher'] is False, data
          else:
              assert data['source'] == 'supabase-storage', data
              assert data['camera_safe_origin'] is False, data
              assert data['blob_launcher'] is True, data
          assert data['password_prompt'] is False, data
          assert data['scanner_workflows'] is True, data
          assert data['invoice_auto'] is True, data
          assert data['compact_product_card'] is True, data
          assert data['purchase_requests'] is True, data
          assert data['catalog_edit'] is True, data
          print('Production iPhone runtime health OK:', data['version'], data['build'])
          PY
