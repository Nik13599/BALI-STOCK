name: Release BALI STOCK Production

on:
  push:
    branches: ["main"]
    paths:
      - "pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: bali-stock-production-release
  cancel-in-progress: false

jobs:
  quality:
    name: production-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - run: flutter pub get
      - run: python tool/code_health_check.py --fail-on-orphans --fail-on-clones
      - run: flutter analyze
      - run: flutter test
      - name: Validate production version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)\s*$', text, re.M)
          if not match:
              raise SystemExit('pubspec version must be semantic version + integer build number')
          print('production version:', match.group(1), 'build:', match.group(2))
          PY

  android:
    name: production-android
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - name: Ensure Android release permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
          ]
          additions = [f'    {permission}' for permission in permissions if permission not in text]
          if additions:
              text = text.replace(marker, marker + '\n' + '\n'.join(additions))
              path.write_text(text, encoding='utf-8')
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Fetch stable Android signing identity with GitHub OIDC
        env:
          SIGNING_BROKER: https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-signing-broker
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          oidc_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=bali-stock-android-signing'
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              token = json.loads(response.read().decode('utf-8'))['value']

          request = urllib.request.Request(
              os.environ['SIGNING_BROKER'],
              data=json.dumps({'token': token}).encode('utf-8'),
              method='POST',
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              signing = json.loads(response.read().decode('utf-8'))

          expected = '95345c6b0eacfbae8e102f1b056e626edffcc41a2c84655c6ac86ba725bc274f'
          if signing.get('cert_sha256') != expected:
              raise SystemExit('Android production signing certificate mismatch')

          key_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'bali-stock-production.jks'
          key_path.write_bytes(base64.b64decode(signing['keystore_base64']))
          values = {
              'ANDROID_KEYSTORE_PATH': str(key_path),
              'ANDROID_STORE_PASSWORD': signing['store_password'],
              'ANDROID_KEY_PASSWORD': signing['key_password'],
              'ANDROID_KEY_ALIAS': signing['key_alias'],
          }
          for value in values.values():
              print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for key, value in values.items():
                  env.write(f'{key}={value}\n')
          print('Stable Android production signing identity received via GitHub OIDC.')
          PY
      - name: Verify signing keystore identity before build
        shell: bash
        run: |
          set -euo pipefail
          actual="$(keytool -exportcert -alias "$ANDROID_KEY_ALIAS" -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" 2>/dev/null | sha256sum | awk '{print $1}')"
          expected="95345c6b0eacfbae8e102f1b056e626edffcc41a2c84655c6ac86ba725bc274f"
          test "$actual" = "$expected"
          echo "Android production certificate verified: $actual"
      - name: Configure Gradle release signing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          if 'create("release")' not in text:
              marker = '    buildTypes {'
              block = '''    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          '''
              if marker not in text:
                  raise SystemExit('Android buildTypes marker not found')
              text = text.replace(marker, block + marker, 1)
          text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          path.write_text(text, encoding='utf-8')
          PY
      - run: flutter build apk --release
      - name: Verify Android production APK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/BALI-STOCK-Android.apk
          "$apksigner" verify --print-certs dist/android/BALI-STOCK-Android.apk > dist/android/BALI-STOCK-Android-Signing.txt
          grep -qi '95345c6b0eacfbae8e102f1b056e626edffcc41a2c84655c6ac86ba725bc274f' <(tr -d ':' < dist/android/BALI-STOCK-Android-Signing.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: production-android
          path: dist/android/*
          if-no-files-found: error

  windows:
    name: production-windows
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows release bundle
        shell: pwsh
        run: ./tool/build_windows_release.ps1
      - name: Install Inno Setup when missing
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
      - name: Build production Windows setup
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $version = (($line -replace '^version:\s*','').Split('+')[0])
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "/DMyOutputBaseFilename=BALI-STOCK-Windows-Setup" "installer/windows/bali_stock.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/windows/BALI-STOCK-Windows-Setup.exe')) { throw "Setup EXE was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: production-windows
          path: dist/windows/BALI-STOCK-Windows-Setup.exe
          if-no-files-found: error

  iphone:
    name: production-iphone-webclip
    needs: quality
    runs-on: ubuntu-latest
    env:
      RUNTIME_PUBLISHER: https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-runtime-publisher
      RUNTIME_URL: https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime
    steps:
      - uses: actions/checkout@v4
      - name: Generate iPhone profile
        run: python tool/generate_mobileconfig.py
      - name: Build self-contained iPhone production runtime
        run: python tool/build_ios_production_runtime.py
      - name: Validate iPhone profile and runtime before publication
        run: |
          python - <<'PY'
          import plistlib
          import re
          from pathlib import Path

          expected = 'https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime'
          with Path('dist/ios/BALI-STOCK-iPhone.mobileconfig').open('rb') as f:
              profile = plistlib.load(f)
          clip = profile['PayloadContent'][0]
          assert clip['PayloadType'] == 'com.apple.webClip.managed'
          assert clip['URL'] == expected
          assert 'github' not in clip['URL'].lower()
          assert clip['Icon']

          html = Path('dist/ios-runtime/bali-stock.html').read_text(encoding='utf-8')
          forbidden = ['raw.githack.com', 'raw.githubusercontent.com/Nik13599/BALI-STOCK', 'Введите пароль доступа', 'Пароль не введён', 'Неверный пароль', 'x-bali-stock-pin']
          assert not [value for value in forbidden if value in html]
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          for index, script in enumerate(scripts):
              Path(f'/tmp/bali-release-inline-{index}.js').write_text(script, encoding='utf-8')
          print('iPhone production runtime validated; inline scripts:', len(scripts))
          PY
          for file in /tmp/bali-release-inline-*.js; do node --check "$file"; done
      - name: Publish iPhone runtime to Supabase using GitHub OIDC
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          version_text = Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', version_text, re.M)
          if not match:
              raise SystemExit('Invalid pubspec version')
          version, build = match.group(1), int(match.group(2))

          oidc_url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=bali-stock-runtime-publish'
          oidc_request = urllib.request.Request(
              oidc_url,
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          with urllib.request.urlopen(oidc_request, timeout=20) as response:
              token = json.loads(response.read().decode('utf-8'))['value']

          payload = {
              'token': token,
              'html': Path('dist/ios-runtime/bali-stock.html').read_text(encoding='utf-8'),
              'version': version,
              'build': build,
          }
          request = urllib.request.Request(
              os.environ['RUNTIME_PUBLISHER'],
              data=json.dumps(payload).encode('utf-8'),
              method='POST',
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = json.loads(response.read().decode('utf-8'))
          if not result.get('ok') or result.get('version') != version or int(result.get('build', 0)) != build:
              raise SystemExit(f'Runtime publication failed: {result}')
          print('iPhone runtime published:', version, build, result.get('sha256'))
          PY
      - name: Verify published iPhone runtime
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          match = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$', Path('pubspec.yaml').read_text(encoding='utf-8'), re.M)
          expected_version, expected_build = match.group(1), int(match.group(2))
          with urllib.request.urlopen(os.environ['RUNTIME_URL'] + '?health=1&release=1', timeout=30) as response:
              health = json.loads(response.read().decode('utf-8'))
          assert health['ok'] is True, health
          assert health['version'] == expected_version, health
          assert int(health['build']) == expected_build, health
          assert health['github_dependency'] is False, health
          assert health['password_prompt'] is False, health
          print('Published iPhone runtime health OK:', health)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-iphone
          path: dist/ios/BALI-STOCK-iPhone.mobileconfig
          if-no-files-found: error

  publish:
    name: publish-production-release
    needs: [quality, android, windows, iphone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-android
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: production-windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: production-iphone
          path: release
      - name: Prepare production channel and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9.]*\)+.*/\1/p' pubspec.yaml)"
          BUILD="$(sed -n 's/^version:[[:space:]]*[0-9.]*+\([0-9]*\).*/\1/p' pubspec.yaml)"
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          git config user.name "BALI STOCK Release"
          git config user.email "release@bali-stock.local"
          git push origin "$GITHUB_SHA:refs/heads/production" --force

          cd release
          sha256sum BALI-STOCK-Windows-Setup.exe BALI-STOCK-Android.apk BALI-STOCK-iPhone.mobileconfig > BALI-STOCK-SHA256.txt
          cat > BALI-STOCK-RELEASE.txt <<EOF
          BALI STOCK $VERSION (build $BUILD)
          GitHub source repository may remain private.
          Windows: install BALI-STOCK-Windows-Setup.exe over the previous production version.
          Android: install BALI-STOCK-Android.apk over the previous production version; the signing identity is preserved through GitHub OIDC.
          iPhone: install BALI-STOCK-iPhone.mobileconfig once. Later application updates are published behind the same stable Supabase runtime URL.
          EOF
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            release/BALI-STOCK-Windows-Setup.exe
            release/BALI-STOCK-Android.apk
            release/BALI-STOCK-Android-Signing.txt
            release/BALI-STOCK-iPhone.mobileconfig
            release/BALI-STOCK-SHA256.txt
            release/BALI-STOCK-RELEASE.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "BALI STOCK $VERSION" --latest
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "BALI STOCK $VERSION" \
              --notes "Production release BALI STOCK $VERSION (build $BUILD). Repository visibility does not affect the working applications. Android signing and iPhone runtime publication use GitHub OIDC with Supabase." \
              --latest
          fi
