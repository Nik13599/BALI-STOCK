name: Deploy BALI STOCK iPhone PWA

on:
  push:
    branches: [main]
    paths:
      - "ios-web/**"
      - "assets/branding/bali_stock_logo.png"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios-web/**"
      - "assets/branding/bali_stock_logo.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build iPhone PWA
        shell: bash
        run: |
          mkdir -p _site
          cp ios-web/v2.html _site/index.html
          cp ios-web/v12-offline.js _site/v12-offline.js
          cp ios-web/sw.js _site/sw.js
          cp ios-web/manifest.webmanifest _site/manifest.webmanifest
          cp assets/branding/bali_stock_logo.png _site/bali_stock_logo.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          js = Path('ios-web/v12-offline.js').read_text(encoding='utf-8')

          html = html.replace(
              r'/(?<![.,\d])(\d{1,4})(?![.,\d])/g',
              r'/(?:^|[^.,\d])(\d{1,4})(?![.,\d])/g'
          )

          head = (
              '<link rel="manifest" href="./manifest.webmanifest">\n'
              '<link rel="apple-touch-icon" href="./bali_stock_logo.png">\n'
              '<meta name="mobile-web-app-capable" content="yes">\n'
              '<meta name="apple-mobile-web-app-capable" content="yes">\n'
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
          )
          html = html.replace('</head>', head + '\n</head>', 1)

          scanner = '<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>'
          marker_script = '<script>\nconst API='
          html = html.replace(marker_script, scanner + '\n<script>\nconst API=', 1)

          marker = "(async()=>{try{await snapshot();"
          if marker not in html:
              raise SystemExit('Startup marker not found in ios-web/v2.html')
          html = html.replace(marker, js + '\n' + marker, 1)
          p.write_text(html, encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Basic HTML validation
        run: |
          grep -q "BALI STOCK" _site/index.html
          grep -q "V12_SYNC_API" _site/index.html
          grep -q "manifest.webmanifest" _site/index.html
          grep -q "Html5Qrcode" _site/index.html
          test -s _site/sw.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
