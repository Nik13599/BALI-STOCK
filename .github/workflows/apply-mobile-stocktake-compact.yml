name: Apply mobile stocktake compact patch

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'release/mobile-stocktake-1.0.5' || github.ref_name == 'release/mobile-stocktake-1.0.5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/mobile-stocktake-1.0.5
          fetch-depth: 0
      - name: Apply compact Android/iOS stocktake UI
        run: python tool/apply_mobile_stocktake_compact.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format and validate patched sources
        run: |
          dart format lib/screens/stocktake_v2_screen.dart
          python -m py_compile tool/build_ios_production_runtime.py tool/apply_mobile_stocktake_compact.py
      - name: Commit generated source changes
        run: |
          git config user.name "BALI STOCK Release"
          git config user.email "release@bali-stock.local"
          git add lib/screens/stocktake_v2_screen.dart tool/build_ios_production_runtime.py pubspec.yaml ios-web/mobile-stocktake-compact-v105.js tool/apply_mobile_stocktake_compact.py
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "feat: compact mobile stocktake controls for Android and iPhone"
          git push origin HEAD:release/mobile-stocktake-1.0.5
