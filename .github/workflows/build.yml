name: Build BALI STOCK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: bali-stock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform wrappers
        run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - run: flutter pub get
      - run: flutter analyze

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - name: Ensure Android release internet permission
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission)
              p.write_text(text, encoding='utf-8')
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=windows,android,ios
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - name: Bundle Microsoft VC++ runtime for standalone launch
        shell: pwsh
        run: |
          $release = Resolve-Path 'build/windows/x64/runner/Release'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {
            throw "Visual Studio C++ tools not found"
          }
          $redistRoot = Join-Path $vs 'VC\Redist\MSVC'
          $crt = Get-ChildItem $redistRoot -Directory | Sort-Object Name -Descending | ForEach-Object {
            $candidate = Join-Path $_.FullName 'x64\Microsoft.VC143.CRT'
            if (Test-Path $candidate) { $candidate }
          } | Select-Object -First 1
          if (-not $crt) {
            throw "Microsoft.VC143.CRT x64 redistributable directory not found"
          }
          Copy-Item (Join-Path $crt '*.dll') -Destination $release -Force
          $required = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          foreach ($dll in $required) {
            if (-not (Test-Path (Join-Path $release $dll))) {
              throw "Required VC runtime DLL missing after copy: $dll"
            }
          }
          Set-Content -Path (Join-Path $release 'BALI-STOCK-START.txt') -Encoding UTF8 -Value @"
          BALI STOCK
          1. Распакуйте ВЕСЬ архив в отдельную папку.
          2. Запускайте bali_stock.exe из этой папки.
          3. Не переносите отдельно только EXE — рядом нужны DLL и папка data.
          "@
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-Windows
          path: build/windows/x64/runner/Release/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - name: Configure iOS camera, photos and ML Kit target
        run: |
          python - <<'PY'
          from pathlib import Path
          import plistlib

          plist_path = Path('ios/Runner/Info.plist')
          with plist_path.open('rb') as f:
              data = plistlib.load(f)
          data['NSCameraUsageDescription'] = 'BALI STOCK использует камеру для сканирования накладных и распознавания поставки.'
          data['NSPhotoLibraryUsageDescription'] = 'BALI STOCK использует фото накладной для распознавания поставки.'
          with plist_path.open('wb') as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_XML, sort_keys=False)

          pbx = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = pbx.read_text(encoding='utf-8')
          import re
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.5;', text)
          pbx.write_text(text, encoding='utf-8')

          podfile = Path('ios/Podfile')
          if podfile.exists():
              p = podfile.read_text(encoding='utf-8')
              if "platform :ios" in p:
                  p = re.sub(r"platform :ios, '[0-9.]+'", "platform :ios, '15.5'", p)
              else:
                  p = "platform :ios, '15.5'\n" + p
              podfile.write_text(p, encoding='utf-8')
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-iOS-unsigned
          path: build/ios/iphoneos/Runner.app/
