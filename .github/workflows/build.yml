name: Build BALI STOCK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: bali-stock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: code-health-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform wrappers
        run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - run: flutter pub get
      - name: Check duplicate lines, code clones, dead files and whitespace
        run: python tool/code_health_check.py --fail-on-orphans --fail-on-clones
      - run: flutter analyze
      - run: flutter test
      - name: Verify live Supabase production backend without mutations
        run: python tool/production_backend_smoke.py

  android:
    name: android-installer
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - name: Ensure Android release permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text(encoding='utf-8')
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
          ]
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          additions = []
          for permission in permissions:
              name = permission.split('android.permission.')[1].split('"')[0]
              if f'android.permission.{name}' not in text:
                  additions.append('    ' + permission)
          if additions:
              text = text.replace(marker, marker + '\n' + '\n'.join(additions))
              p.write_text(text, encoding='utf-8')
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - name: Prepare Android CI package
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/BALI-STOCK-Android-CI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-Android-CI
          path: dist/android/BALI-STOCK-Android-CI.apk
          if-no-files-found: error

  windows:
    name: windows-installer
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows release bundle
        shell: pwsh
        run: ./tool/build_windows_release.ps1
      - name: Install Inno Setup when missing
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
      - name: Build Windows setup EXE
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $version = (($line -replace '^version:\s*','').Split('+')[0])
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "/DMyOutputBaseFilename=BALI-STOCK-Windows-CI-Setup" "installer/windows/bali_stock.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/windows/BALI-STOCK-Windows-CI-Setup.exe')) { throw "Setup EXE was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-Windows-CI
          path: dist/windows/BALI-STOCK-Windows-CI-Setup.exe
          if-no-files-found: error

  ios:
    name: ios-native-unsigned
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name bali_stock --org com.bali.stock --platforms=android,ios,windows
      - name: Configure iOS camera, photos and deployment target
        run: |
          python - <<'PY'
          from pathlib import Path
          import plistlib
          import re

          plist_path = Path('ios/Runner/Info.plist')
          with plist_path.open('rb') as f:
              data = plistlib.load(f)
          data['NSCameraUsageDescription'] = 'BALI STOCK использует камеру для сканирования QR-кодов, штрихкодов и накладных.'
          data['NSPhotoLibraryUsageDescription'] = 'BALI STOCK использует фото накладной для распознавания поставки.'
          with plist_path.open('wb') as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_XML, sort_keys=False)

          pbx = Path('ios/Runner.xcodeproj/project.pbxproj')
          text = pbx.read_text(encoding='utf-8')
          text = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.5;', text)
          pbx.write_text(text, encoding='utf-8')

          podfile = Path('ios/Podfile')
          if podfile.exists():
              p = podfile.read_text(encoding='utf-8')
              if "platform :ios" in p:
                  p = re.sub(r"platform :ios, '[0-9.]+'", "platform :ios, '15.5'", p)
              else:
                  p = "platform :ios, '15.5'\n" + p
              podfile.write_text(p, encoding='utf-8')
          PY
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build ios --release --no-codesign
      - name: Pack unsigned native iOS app
        run: |
          mkdir -p dist/ios
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/ios/BALI-STOCK-iOS-CI-unsigned.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-iOS-CI-unsigned
          path: dist/ios/BALI-STOCK-iOS-CI-unsigned.app.zip
          if-no-files-found: error

  ios_webclip:
    name: iphone-mobileconfig
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate iPhone installation profile
        run: python tool/generate_mobileconfig.py
      - name: Validate configuration profile
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path('dist/ios/BALI-STOCK-iPhone.mobileconfig')
          with path.open('rb') as f:
              profile = plistlib.load(f)
          assert profile['PayloadType'] == 'Configuration'
          clip = profile['PayloadContent'][0]
          assert clip['PayloadType'] == 'com.apple.webClip.managed'
          expected = 'https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-stock-ios-runtime'
          assert clip['URL'] == expected, clip['URL']
          assert 'github' not in clip['URL'].lower()
          assert clip['Icon']
          print('mobileconfig Supabase production runtime OK:', clip['URL'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-STOCK-iPhone-WebClip-CI
          path: dist/ios/BALI-STOCK-iPhone.mobileconfig
          if-no-files-found: error
