group 'com.bali.stock.invoiceocr'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.bali.stock.invoiceocr'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.8.0'
}
