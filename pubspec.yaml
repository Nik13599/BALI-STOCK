name: bali_stock
description: BALI STOCK — складской учет и полный переучет продукции ночного клуба.
publish_to: "none"
version: 0.16.0+16

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bali_invoice_ocr:
    path: packages/bali_invoice_ocr
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter_svg: ^2.2.1
  http: ^1.5.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.13.0
  printing: ^5.15.0
  sqflite: ^2.4.3
  sqflite_common: ^2.5.11
  sqflite_common_ffi: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/bali_stock_logo.svg

flutter_launcher_icons:
  image_path: assets/branding/bali_stock_logo.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#101A1F"
  adaptive_icon_foreground: assets/branding/bali_stock_logo.png
  windows:
    generate: true
    image_path: assets/branding/bali_stock_logo.png
    icon_size: 256
