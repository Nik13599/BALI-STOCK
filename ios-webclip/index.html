<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BALI STOCK">
<meta name="theme-color" content="#07120d">
<title>BALI STOCK</title>
<style>
:root{--bg:#06100b;--card:#0d1b14;--card2:#12241a;--line:#294533;--green:#73d59a;--text:#f3f6f4;--muted:#96a69c;--red:#ff6b6b;--gold:#d8b45f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06100b,#091610);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:10;background:rgba(6,16,11,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}header img{width:42px;height:42px;border-radius:10px}h1{font-size:17px;margin:0}.sub{color:var(--muted);font-size:12px}.wrap{padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,input,select{font:inherit}button{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:10px 13px;font-weight:650}button.primary{background:#1c6c3e;border-color:#2f9a5b}button.danger{background:#562121;border-color:#8b3838}button.ghost{background:transparent}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.category{margin:14px 0 7px;color:var(--green);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.name{font-weight:700}.qty{font-size:13px;color:#cfe5d6;margin-top:4px}.muted{color:var(--muted)}.red{color:var(--red)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#173523;color:#9be0b3;font-size:12px}.badge.gray{background:#253129;color:#b9c3bc}.badge.red{background:#432525;color:#ff9b9b}.field{width:100%;background:#07110c;border:1px solid var(--line);color:white;border-radius:11px;padding:11px;margin:5px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.progress{height:9px;background:#14241a;border-radius:99px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#42b975}.item-input{padding:10px;border:1px solid #1f3b2b;border-radius:13px;margin:7px 0;background:#0a1710}.item-input.done{border-color:#2f8d52}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(5,14,9,.96);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.bottom button{border:0;background:transparent;padding:7px 3px;font-size:11px;color:#9cad9f}.bottom button.active{color:var(--green)}.bigicon{display:block;font-size:20px;margin-bottom:2px}.modal{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.72);display:flex;align-items:flex-end}.modal .sheet{width:100%;background:#0b1811;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid #37533f}.modal h3{margin:0 0 8px}.modal .actions{display:grid;gap:8px;margin-top:14px}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:28px 10px}.small{font-size:12px}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat .card{margin:0}details{margin:7px 0}summary{cursor:pointer}.search{margin-bottom:8px}
</style>
</head>
<body>
<header><img src="../assets/branding/bali_stock_logo.png" alt="BALI STOCK"><div><h1>BALI STOCK</h1><div class="sub" id="headerSub">Складской учёт</div></div></header>
<main class="wrap" id="app"><div class="empty">Загрузка каталога…</div></main>
<nav class="bottom">
<button data-tab="stock" class="active"><span class="bigicon">📦</span>Склад</button>
<button data-tab="delivery"><span class="bigicon">🚚</span>Поставка</button>
<button data-tab="stocktake"><span class="bigicon">✅</span>Переучёт</button>
<button data-tab="history"><span class="bigicon">🕘</span>История</button>
</nav>
<div id="modalRoot"></div>
<script>
const PIN_HASH='dc731f13f58f114657956a71d8f42886da116e604022b139581c16c43d7e3b94';
const STORE='bali_stock_web_v1'; let state={version:1,products:[],categories:[],operations:[],drafts:{},lastEmployee:'',editMode:false}; let tab='stock'; let currentEmployee='';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(STORE,JSON.stringify(state))} function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&x.version)state={...state,...x,editMode:false}}catch(e){}}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pin(){const v=prompt('Введите пароль доступа');return v!==null&&(await sha(v))===PIN_HASH}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
async function initCatalog(){load();let txt='';try{txt=await fetch('../lib/data/seed_catalog.dart',{cache:'no-store'}).then(r=>r.text())}catch(e){} const re=/SeedProduct\('((?:\\'|[^'])*)', '((?:\\'|[^'])*)', (\d+)(?:, unit: '([^']+)')?\)/g;let m,seed=[];while((m=re.exec(txt))){seed.push({category:m[1].replaceAll("\\'","'"),name:m[2].replaceAll("\\'","'"),packageSize:+m[3],unit:m[4]||'ml'})}if(seed.length){for(const p of seed){if(!state.products.some(x=>x.name.toLowerCase()===p.name.toLowerCase()))state.products.push({id:id(),...p,whole:0,extra:0,min:0,initialized:false,active:true})}state.categories=[...new Set(seed.map(x=>x.category).concat(state.categories))];save()}if(!state.products.length){$('#app').innerHTML='<div class="card red">Не удалось загрузить стартовый каталог. Подключитесь к интернету и откройте приложение ещё раз.</div>';return}render()}
function unitSymbol(p){return p.unit==='g'?'г':p.unit==='pcs'?'шт.':'мл'} function packLabel(p){return p.unit==='g'?'уп.':p.unit==='pcs'?'шт.':'бут.'}
function total(p){return p.unit==='pcs'?p.whole:p.whole*p.packageSize+p.extra}
function fmtPack(p){if(p.unit==='pcs')return '1 шт.';if(p.unit==='g')return p.packageSize>=1000&&p.packageSize%1000===0?(p.packageSize/1000)+' кг':p.packageSize+' г';return p.packageSize>=1000&&p.packageSize%1000===0?(p.packageSize/1000)+' л':(p.packageSize/1000).toFixed(3).replace(/0+$/,'').replace(/\.$/,'').replace('.',',')+' л'}
function fmtQty(p,v=total(p)){if(p.unit==='pcs')return v+' шт.';const w=Math.floor(v/p.packageSize),e=v%p.packageSize;return `${w} ${packLabel(p)} × ${fmtPack(p)} + ${e} ${unitSymbol(p)}`}
function dur(sec){sec=Math.max(0,Math.floor(sec||0));let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h} ч ${String(m).padStart(2,'0')} мин`:m?`${m} мин`:`${sec%60} сек`}
function dt(v){return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function render(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#headerSub').textContent=({stock:'Склад',delivery:'Приёмка поставки',stocktake:'Переучёт',history:'История операций'})[tab]; if(tab==='stock')renderStock();if(tab==='delivery')renderDelivery();if(tab==='stocktake')renderStocktake();if(tab==='history')renderHistory()}
function groupProducts(list){const map={};for(const p of list.filter(x=>x.active!==false))(map[p.category]??=[]).push(p);return map}
function renderStock(){const q=(window.stockQ||'').toLowerCase();const list=state.products.filter(p=>!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q));let h=`<div class="toolbar"><button class="${state.editMode?'danger':'primary'}" onclick="toggleEdit()">${state.editMode?'Закрыть редактирование':'✏️ Редактировать склад'}</button>${state.editMode?'<button onclick="addProduct()">＋ Добавить позицию</button>':''}</div><input class="field search" placeholder="Поиск по складу" value="${esc(window.stockQ||'')}" oninput="window.stockQ=this.value;renderStock()">`;for(const [cat,arr] of Object.entries(groupProducts(list))){h+=`<div class="category">${esc(cat)} · ${arr.length}</div>`;for(const p of arr){const low=p.initialized&&total(p)<=p.min;h+=`<div class="card"><div class="row"><div><div class="name ${low?'red':''}">${esc(p.name)}</div><div class="qty ${!p.initialized?'muted':low?'red':''}">${p.initialized?fmtQty(p):'Остаток не введён'}</div><div class="small muted">${p.unit==='pcs'?'Поштучный учёт':'Тара/упаковка: '+fmtPack(p)}${p.min?` · минимум ${p.min} ${unitSymbol(p)}`:''}</div></div>${state.editMode?`<button onclick="editProduct('${p.id}')">✏️</button>`:''}</div></div>`}}$('#app').innerHTML=h||'<div class="empty">Ничего не найдено</div>'}
async function toggleEdit(){if(state.editMode){state.editMode=false;save();render();return}if(!(await pin())){alert('Неверный пароль');return}state.editMode=true;render()}
function chooseUnit(v){return ['ml','g','pcs'].includes(v)?v:'ml'}
function addProduct(){let name=prompt('Название новой позиции');if(!name)return;let category=prompt('Категория',state.categories[0]||'Прочее');if(!category)return;let unit=chooseUnit(prompt('Тип учёта: ml = бутылки/мл, g = вес/граммы, pcs = штуки','ml'));let size=unit==='pcs'?1:+prompt(unit==='g'?'Вес одной упаковки, г':'Объём одной бутылки, мл','1000');if(!size||size<1)return alert('Некорректный размер');let min=+prompt('Минимальный остаток в базовой единице (можно 0)','0')||0;state.products.push({id:id(),name:name.trim(),category:category.trim(),packageSize:size,unit,whole:0,extra:0,min,initialized:false,active:true});if(!state.categories.includes(category.trim()))state.categories.push(category.trim());save();renderStock()}
function editProduct(pid){const p=state.products.find(x=>x.id===pid);if(!p)return;let name=prompt('Название',p.name);if(!name)return;let cat=prompt('Категория',p.category);if(!cat)return;let unit=chooseUnit(prompt('Тип: ml / g / pcs',p.unit));let size=unit==='pcs'?1:+prompt(unit==='g'?'Вес упаковки, г':'Объём бутылки, мл',p.packageSize);if(!size)return;let min=+prompt('Минимальный остаток',p.min)||0;if(p.initialized&&total(p)>0&&(unit!==p.unit||size!==p.packageSize))return alert('Нельзя менять тип учёта/тару у позиции с ненулевым остатком.');Object.assign(p,{name:name.trim(),category:cat.trim(),unit,packageSize:size,min});if(unit==='pcs')p.extra=0;if(!state.categories.includes(p.category))state.categories.push(p.category);save();renderStock()}
async function gated(to){if((to==='delivery'||to==='stocktake')&&!(await pin())){alert('Неверный пароль');return}if(tab==='stocktake'&&to!=='stocktake')pauseCurrentDraft();tab=to;if(to==='stocktake')await enterStocktake();else render()}
document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>gated(b.dataset.tab));
let deliveryLines=[];
function renderDelivery(){if(state.products.some(p=>p.active!==false&&!p.initialized)){$('#app').innerHTML='<div class="card"><b>Поставка пока заблокирована.</b><div class="muted" style="margin-top:6px">Сначала завершите первичный полный переучёт всех позиций.</div></div>';return}const opts=state.products.filter(p=>p.active!==false).map(p=>`<option value="${p.id}">${esc(p.category)} — ${esc(p.name)}</option>`).join('');let h=`<div class="card"><select id="delProduct" class="field">${opts}</select><div class="grid2"><input id="delWhole" type="number" min="0" class="field" placeholder="Целых единиц"><input id="delExtra" type="number" min="0" class="field" placeholder="Доп. мл/г"></div><button class="primary" onclick="addDeliveryLine()">Добавить в поставку</button></div>`;for(const l of deliveryLines){const p=state.products.find(x=>x.id===l.productId);h+=`<div class="card row"><div><b>${esc(p.name)}</b><div class="muted">+ ${p.unit==='pcs'?l.whole+' шт.':l.whole+' '+packLabel(p)+' + '+l.extra+' '+unitSymbol(p)}</div></div><button onclick="deliveryLines=deliveryLines.filter(x=>x!==arguments[0]);renderDelivery()" class="ghost">×</button></div>`}h+=`<button class="primary" style="width:100%;margin-top:10px" ${deliveryLines.length?'':'disabled'} onclick="completeDelivery()">ПРОВЕСТИ ПОСТАВКУ</button>`;$('#app').innerHTML=h}
function addDeliveryLine(){const p=state.products.find(x=>x.id===$('#delProduct').value);let w=Number($('#delWhole').value),e=p.unit==='pcs'?0:Number($('#delExtra').value||0);if(!Number.isInteger(w)||w<0||!Number.isInteger(e)||e<0||(p.unit!=='pcs'&&e>=p.packageSize))return alert('Проверьте количество и дополнительный остаток');deliveryLines.push({productId:p.id,whole:w,extra:e});renderDelivery()}
function completeDelivery(){if(!deliveryLines.length)return;let lines=[];for(const l of deliveryLines){const p=state.products.find(x=>x.id===l.productId),before=total(p),added=p.unit==='pcs'?l.whole:l.whole*p.packageSize+l.extra,after=before+added;if(p.unit==='pcs'){p.whole=after;p.extra=0}else{p.whole=Math.floor(after/p.packageSize);p.extra=after%p.packageSize}lines.push({productId:p.id,name:p.name,category:p.category,unit:p.unit,packageSize:p.packageSize,before,change:added,after,beforeInitialized:true})}state.operations.unshift({id:id(),type:'delivery',createdAt:new Date().toISOString(),lines});deliveryLines=[];save();alert('Поставка проведена');renderDelivery()}
function draftKey(name){return name.trim().toLowerCase()} function getDraft(){return state.drafts[draftKey(currentEmployee)]}
function activeSeconds(d){return (d.activeSeconds||0)+(d.activeStartedAt?Math.floor((Date.now()-d.activeStartedAt)/1000):0)}
function pauseCurrentDraft(){const d=getDraft();if(d&&d.activeStartedAt){d.activeSeconds=activeSeconds(d);d.activeStartedAt=null;d.status='draft';d.updatedAt=new Date().toISOString();save()}}
function resumeDraft(d){d.status='in_progress';d.activeStartedAt=Date.now();d.updatedAt=new Date().toISOString();save()}
async function enterStocktake(){let emp=prompt('ФИО сотрудника',state.lastEmployee||'');if(!emp){tab='stock';return render()}currentEmployee=emp.trim();state.lastEmployee=currentEmployee;let k=draftKey(currentEmployee),d=state.drafts[k];if(d){pauseCurrentDraft();const choice=await choiceModal('У вас есть незавершённый переучёт',`Начат: ${dt(d.startedAt)}<br>Заполнено: ${filled(d)} из ${d.lines.length} позиций`,[{id:'continue',text:'Продолжить переучёт',primary:true},{id:'restart',text:'Начать сначала',danger:true},{id:'cancel',text:'Отмена'}]);if(choice==='cancel'){tab='stock';return render()}if(choice==='restart'){const ok=await choiceModal('Начать переучёт заново?','Все данные текущего черновика будут удалены.',[{id:'no',text:'Отмена'},{id:'yes',text:'Начать заново',danger:true}]);if(ok!=='yes'){tab='stock';return render()}delete state.drafts[k];d=null}}
if(!d){d={id:id(),employee:currentEmployee,status:'in_progress',startedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),activeSeconds:0,activeStartedAt:Date.now(),lastProductId:null,lines:state.products.filter(p=>p.active!==false).map(p=>({productId:p.id,name:p.name,category:p.category,unit:p.unit,packageSize:p.packageSize,before: p.initialized?total(p):0,beforeInitialized:p.initialized,whole:null,extra:p.unit==='pcs'?0:null}))};state.drafts[k]=d}else resumeDraft(d);save();renderStocktake();setTimeout(()=>{if(d.lastProductId)document.getElementById('st_'+d.lastProductId)?.scrollIntoView({block:'center'})},120)}
function lineValid(l){return Number.isInteger(l.whole)&&l.whole>=0&&(l.unit==='pcs'||(Number.isInteger(l.extra)&&l.extra>=0&&l.extra<l.packageSize))} function filled(d){return d.lines.filter(lineValid).length}
function renderStocktake(){const d=getDraft();if(!d){$('#app').innerHTML='<div class="empty">Нет активного переучёта</div>';return}const n=filled(d),pct=Math.round(100*n/d.lines.length);let h=`<div class="card"><div class="row"><div><b>${esc(d.employee)}</b><div class="muted small">Начат ${dt(d.startedAt)}</div></div><span class="badge">В процессе</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="row"><b>${n} / ${d.lines.length}</b><span class="muted">Активно: ${dur(activeSeconds(d))}</span></div></div>`;let last='';for(const l of d.lines){if(l.category!==last){last=l.category;h+=`<div class="category">${esc(last)}</div>`}const ok=lineValid(l);h+=`<div id="st_${l.productId}" class="item-input ${ok?'done':''}"><div class="name">${esc(l.name)}</div><div class="small muted">${l.unit==='pcs'?'Поштучно':fmtPack({unit:l.unit,packageSize:l.packageSize})}</div>${l.unit==='pcs'?`<input class="field" type="number" min="0" placeholder="Количество, шт." value="${l.whole??''}" oninput="stChange('${l.productId}','whole',this.value)">`:`<div class="grid2"><input class="field" type="number" min="0" placeholder="${l.unit==='g'?'Упаковок':'Бутылок'}" value="${l.whole??''}" oninput="stChange('${l.productId}','whole',this.value)"><input class="field" type="number" min="0" placeholder="Доп. ${l.unit==='g'?'г':'мл'}" value="${l.extra??''}" oninput="stChange('${l.productId}','extra',this.value)"></div>`}</div>`}h+=`<button class="primary" style="width:100%;margin-top:12px" ${n===d.lines.length?'':'disabled'} onclick="completeStocktake()">ЗАВЕРШИТЬ ПЕРЕУЧЁТ</button>`;$('#app').innerHTML=h}
function stChange(pid,field,val){const d=getDraft(),l=d?.lines.find(x=>x.productId===pid);if(!l)return; l[field]=val===''?null:Number(val);d.lastProductId=pid;d.updatedAt=new Date().toISOString();save();renderStocktake()}
function completeStocktake(){const d=getDraft();if(!d||filled(d)!==d.lines.length)return alert('Не заполнены все позиции');pauseCurrentDraft();let lines=[];for(const l of d.lines){const p=state.products.find(x=>x.id===l.productId);if(!p)continue;const before=l.before,actual=l.unit==='pcs'?l.whole:l.whole*l.packageSize+l.extra;lines.push({productId:p.id,name:l.name,category:l.category,unit:l.unit,packageSize:l.packageSize,before,change:actual-before,after:actual,beforeInitialized:l.beforeInitialized});if(p.unit==='pcs'){p.whole=actual;p.extra=0}else{p.whole=Math.floor(actual/p.packageSize);p.extra=actual%p.packageSize}p.initialized=true}const completed=new Date(),active=d.activeSeconds||0,totalS=Math.max(0,Math.floor((completed-new Date(d.startedAt))/1000));state.operations.unshift({id:id(),type:'stocktake',createdAt:completed.toISOString(),employee:d.employee,startedAt:d.startedAt,completedAt:completed.toISOString(),activeSeconds:active,totalSeconds:totalS,lines});delete state.drafts[draftKey(currentEmployee)];save();alert('Переучёт завершён');tab='history';render()}
function renderHistory(){let h='';const ds=Object.values(state.drafts);if(ds.length){h+='<div class="category">Незавершённые переучёты</div>';for(const d of ds)h+=`<div class="card"><div class="row"><b>${esc(d.employee)}</b><span class="badge gray">${d.status==='in_progress'?'В процессе':'Черновик'}</span></div><div class="muted small">Начат: ${dt(d.startedAt)}</div><div style="margin-top:5px">${filled(d)} из ${d.lines.length} позиций · ${dur(activeSeconds(d))}</div></div>`}if(!state.operations.length)h+='<div class="empty">Завершённых операций пока нет</div>';for(const o of state.operations){const st=o.type==='stocktake';h+=`<details class="card"><summary><b>${st?'Переучёт':'Поставка'}</b> · ${dt(o.createdAt)} ${st?'<span class="badge">Завершён</span>':''}</summary>${st?`<div class="small" style="margin-top:10px"><b>Сотрудник:</b> ${esc(o.employee||'—')}<br><b>Начало:</b> ${dt(o.startedAt)}<br><b>Завершение:</b> ${dt(o.completedAt)}<br><b>Активное время:</b> ${dur(o.activeSeconds)}<br><b>Общий период:</b> ${dur(o.totalSeconds)}</div>`:''}<div style="margin-top:10px">${o.lines.map(l=>`<div class="small" style="padding:5px 0;border-top:1px solid #1f3627"><b>${esc(l.name)}</b><br><span class="muted">${l.beforeInitialized?'Было '+fmtQty({unit:l.unit,packageSize:l.packageSize},l.before):'Первичный остаток'} → ${fmtQty({unit:l.unit,packageSize:l.packageSize},l.after)}${o.type==='delivery'?' · +'+fmtQty({unit:l.unit,packageSize:l.packageSize},l.change):''}</span></div>`).join('')}</div></details>`}$('#app').innerHTML=h}
function choiceModal(title,body,buttons){return new Promise(res=>{const root=$('#modalRoot');root.innerHTML=`<div class="modal"><div class="sheet"><h3>${title}</h3><div class="muted">${body}</div><div class="actions">${buttons.map(b=>`<button data-id="${b.id}" class="${b.primary?'primary':b.danger?'danger':''}">${b.text}</button>`).join('')}</div></div></div>`;root.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.id;root.innerHTML='';res(v)})})}
document.addEventListener('visibilitychange',()=>{if(tab==='stocktake'){if(document.hidden)pauseCurrentDraft();else{const d=getDraft();if(d)resumeDraft(d)}}});window.addEventListener('beforeunload',pauseCurrentDraft);setInterval(()=>{if(tab==='stocktake'&&getDraft()){save();const el=document.querySelector('.card .muted:last-child');}},15000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});initCatalog();
</script>
</body>
</html>
